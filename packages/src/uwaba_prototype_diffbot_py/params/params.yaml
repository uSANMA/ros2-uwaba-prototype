uwaba_controller_server_node:
  ros__parameters:
    wheels_separation: 0.13607
    wheel_radius: 0.0161000025
    transform_rate: 100.0
    goal_position_x: 1.0
    goal_orientation_z: 0.0
    tune_velocity: 1.0
    max_linear_velocity: 0.3       # Max velocity in m/s at linear x (so that the robot start moving and jump start its motion towards the goal)
    odom_topic: "odom"
    joint_states_topic: "joint_states"
    uros_encoder_topic: "micro_encoders"
    uros_imu_topic: "micro_imu"
    uros_temperature_topic: "micro_temperature"
    uros_lidar_topic: "micro_laserscan"
    cmd_vel_topic: "cmd_vel"
    imu_topic: "imu"

uwaba_controller_manager_node:
  ros__parameters:
    goal_request: "activate main loop"
    child_frame_id: "uwaba_prototype_action"
    managed_node_name: "uwaba_controller_server_node"
